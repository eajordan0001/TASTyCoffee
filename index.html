<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Young佬院咖啡</title>

  <!-- PWA 核心設定檔案引入 -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1e3a8a">
  <link rel="apple-touch-icon" href="icon-192.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  
  <!-- 引入 Firebase SDK (實現 11 人跨手機即時連線同步) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    /* 點餐狀態標籤：40px 字型 (放大一倍)、足夠寬度防止換行並保持右對齊靠左拉開 */
    .status-label-fixed {
      font-size: 40px;
      line-height: 52px;
      display: inline-block;
      width: 5.2em;
      text-align: center;
      font-weight: 700;
      white-space: nowrap;
    }
  </style>
</head>
<body class="bg-sky-100 min-h-screen p-6 text-gray-800">

  <div id="app" class="max-w-2xl mx-auto space-y-8">

    <!-- 1. PIN 碼身份驗證視窗 (未解鎖時顯示) -->
    <div v-if="!currentUserId" class="bg-white rounded-3xl p-10 shadow-2xl space-y-8 mt-12 border-4 border-blue-200">
      <h2 class="text-3xl font-extrabold text-blue-900 text-center">☕ 咖啡點餐身份解鎖</h2>
      
      <div class="space-y-3">
        <label class="text-base font-bold text-gray-600">選擇你的名字</label>
        <select v-model="selectedUserToAuth" class="w-full border-2 border-blue-200 rounded-2xl p-4 text-xl bg-sky-50 focus:outline-blue-600 font-bold">
          <option value="" disabled>-- 請選擇成員 --</option>
          <option v-for="u in members" :key="u.id" :value="u.id">{{ u.name }}</option>
        </select>
      </div>

      <div class="space-y-3">
        <label class="text-base font-bold text-gray-600">4 位數 PIN 碼</label>
        <input 
          type="password" 
          maxlength="4" 
          v-model="inputPin" 
          placeholder="請輸入 PIN 碼" 
          class="w-full border-2 border-blue-200 rounded-2xl p-4 text-center text-3xl tracking-widest bg-sky-50 focus:outline-blue-600 font-bold"
          @keyup.enter="loginWithPin"
        >
      </div>

      <div v-if="authError" class="text-lg text-red-500 font-bold text-center">
        {{ authError }}
      </div>

      <button 
        @click="loginWithPin" 
        class="w-full bg-blue-700 hover:bg-blue-800 text-white font-extrabold text-2xl py-5 rounded-2xl transition-all shadow-lg active:scale-95"
      >
        確認解鎖
      </button>
    </div>

    <!-- 2. 主要點餐介面 (驗證通過後顯示) -->
    <template v-else>
      <!-- 頂部列：登入狀態與日期切換 -->
      <header class="bg-white rounded-3xl p-8 shadow-md space-y-6 border-2 border-blue-200">
        <div class="flex justify-between items-center border-b-2 border-blue-100 pb-4">
          <h1 class="text-3xl font-extrabold text-blue-900">☕ 每日咖啡點餐</h1>
          <div class="flex items-center space-x-3 text-lg">
            <span class="text-gray-500">解鎖者：</span>
            <span class="font-extrabold text-amber-600">{{ currentUser.name }}</span>
            <button @click="logout" class="text-gray-400 hover:text-red-500 underline ml-4 font-bold">切換身份</button>
          </div>
        </div>
        <div class="flex items-center justify-between">
          <label class="text-xl font-bold text-gray-700">選擇日期：</label>
          <input type="date" v-model="selectedDate" @change="listenToOrders" class="border-2 border-blue-200 rounded-2xl px-5 py-3 text-lg bg-sky-50 focus:outline-blue-600 font-bold">
        </div>
      </header>

      <!-- 每日點餐清單（所有成員） -->
      <main class="space-y-6">
        <div 
          v-for="member in members" 
          :key="member.id"
          class="bg-white rounded-3xl p-8 shadow-md border-4 transition-all"
          :class="member.id === currentUserId ? 'border-amber-400 ring-4 ring-amber-100' : 'border-transparent'"
        >
          <div class="flex justify-between items-center mb-6">
            <div class="flex items-center space-x-3">
              <span class="font-extrabold text-2xl text-blue-950">{{ member.name }}</span>
              <span v-if="member.id === currentUserId" class="text-base bg-amber-100 text-amber-900 px-4 py-1 rounded-full font-bold">本人 (可編輯)</span>
            </div>
            <!-- 狀態標籤：40px，寬度向左拉開 -->
            <div class="flex items-center space-x-4">
              <span v-if="dailyOrders[member.id] && dailyOrders[member.id].length > 0" class="text-emerald-600 status-label-fixed">
                (成功點餐)
              </span>
              <span v-else class="text-gray-400 status-label-fixed">
                (尚未點餐)
              </span>
              <span class="text-2xl font-black text-gray-700 min-w-[5rem] text-right">
                ${{ getUserTotal(dailyOrders[member.id]) }}
              </span>
            </div>
          </div>

          <!-- 非本人：僅顯示點餐結果清單 -->
          <div v-if="member.id !== currentUserId" class="text-lg text-gray-700 bg-sky-50/80 p-6 rounded-2xl space-y-4 border border-sky-100">
            <template v-if="dailyOrders[member.id] && dailyOrders[member.id].length > 0">
              <div v-for="(item, idx) in dailyOrders[member.id]" :key="idx" class="border-b border-sky-200 last:border-0 pb-3 last:pb-0">
                <div class="font-bold text-gray-900 flex justify-between text-xl">
                  <span>{{ item.item }} x{{ item.qty }}</span>
                  <span>${{ getItemUnitPrice(item) * item.qty }}</span>
                </div>
                <div class="text-base text-gray-600 mt-1">
                  {{ item.item === '美式' ? item.ice : `${item.sweetness} / ${item.ice}` }}
                  <span v-if="item.addShot || item.addMilk" class="text-amber-700 font-bold ml-2">
                    [{{ [item.addShot ? '加濃縮' : '', item.addMilk ? '加牛奶' : ''].filter(Boolean).join(' + ') }}]
                  </span>
                  <span v-if="item.note" class="ml-2">｜備註: {{ item.note }}</span>
                </div>
              </div>
            </template>
            <template v-else>
              <span class="text-gray-400 italic font-medium">尚未點餐</span>
            </template>
          </div>

          <!-- 本人：購物車與點餐表單 -->
          <div v-else class="space-y-6 text-base">
            
            <!-- 目前已加入購物車清單 -->
            <div v-if="cart.length > 0" class="bg-amber-50/90 rounded-2xl p-6 border-2 border-amber-300 space-y-4">
              <div class="text-base font-extrabold text-amber-950 border-b-2 border-amber-200 pb-2 flex justify-between text-lg">
                <span>🛒 我的點餐清單 (共 {{ myTotalCups }} 杯)</span>
                <span>小計: ${{ getUserTotal(cart) }}</span>
              </div>
              <div v-for="(item, idx) in cart" :key="idx" class="flex justify-between items-center py-2 border-b border-amber-200/60 last:border-0">
                <div>
                  <span class="font-bold text-amber-950 text-lg">{{ item.item }}</span>
                  <span class="text-amber-800 font-bold ml-2">x{{ item.qty }}</span>
                  <span class="text-gray-600 ml-2">
                    ({{ item.item === '美式' ? item.ice : `${item.sweetness}/${item.ice}` }})
                  </span>
                  <span v-if="item.addShot || item.addMilk" class="text-amber-800 font-bold ml-2">
                    [{{ [item.addShot ? '加濃縮' : '', item.addMilk ? '加牛奶' : ''].filter(Boolean).join(' + ') }}]
                  </span>
                  <div v-if="item.note" class="text-gray-500 italic mt-0.5">備註: {{ item.note }}</div>
                </div>
                <div class="flex items-center space-x-4">
                  <span class="font-extrabold text-amber-900 text-lg">${{ getItemUnitPrice(item) * item.qty }}</span>
                  <button @click="removeFromCart(idx)" class="text-red-500 font-black text-xl px-2 py-0.5 hover:bg-red-100 rounded-lg">✕</button>
                </div>
              </div>
            </div>

            <!-- 新增飲品表單 -->
            <div class="bg-sky-50/70 p-6 rounded-2xl space-y-6 border-2 border-sky-200">
              <div class="text-lg font-extrabold text-blue-900">➕ 新增飲品到清單</div>
              
              <!-- 品項選擇（大幅強化點選對比效果） -->
              <div class="grid grid-cols-2 gap-4">
                <button 
                  type="button"
                  v-for="item in ['拿鐵', '美式', '巧克力牛奶', '摩卡咖啡']" 
                  :key="item"
                  @click="selectItem(item)"
                  class="py-4 border-2 rounded-2xl text-center font-extrabold transition-all text-lg duration-150 active:scale-95 shadow-sm"
                  :class="currentItem.item === item 
                    ? 'bg-blue-600 text-white border-blue-700 shadow-md ring-4 ring-blue-200 scale-[1.02]' 
                    : 'bg-white text-gray-700 border-sky-200 hover:border-blue-400 hover:bg-sky-100/50'"
                >
                  {{ item }} (${{ getPrice(item) }})
                </button>
              </div>

              <!-- 數量、奶類(糖度)、冰塊 -->
              <div class="grid gap-4" :class="currentItem.item === '美式' ? 'grid-cols-2' : 'grid-cols-3'">
                <div>
                  <label class="block text-base font-bold text-gray-600 mb-2">數量</label>
                  <select v-model.number="currentItem.qty" class="w-full border-2 border-sky-200 rounded-xl p-3 bg-white font-bold text-lg focus:border-blue-600">
                    <option v-for="n in 5" :key="n" :value="n">{{ n }} 杯</option>
                  </select>
                </div>
                
                <!-- 僅在非美式時顯示奶類選項 -->
                <div v-if="currentItem.item !== '美式'">
                  <label class="block text-base font-bold text-gray-600 mb-2">奶類</label>
                  <select v-model="currentItem.sweetness" class="w-full border-2 border-sky-200 rounded-xl p-3 bg-white font-bold text-lg focus:border-blue-600">
                    <option v-for="opt in sweetnessOptions" :key="opt" :value="opt">{{ opt }}</option>
                  </select>
                </div>

                <div>
                  <label class="block text-base font-bold text-gray-600 mb-2">冰塊</label>
                  <select v-model="currentItem.ice" class="w-full border-2 border-sky-200 rounded-xl p-3 bg-white font-bold text-lg focus:border-blue-600">
                    <option v-for="opt in iceOptions" :key="opt" :value="opt">{{ opt }}</option>
                  </select>
                </div>
              </div>

              <!-- 加價加選項目按鈕區（選取效果優化） -->
              <div>
                <label class="block text-base font-bold text-gray-600 mb-2">加價加選 (可複選)</label>
                <div class="grid grid-cols-2 gap-4">
                  <button 
                    type="button"
                    @click="currentItem.addShot = !currentItem.addShot"
                    class="py-3 border-2 rounded-xl text-base font-bold transition-all flex items-center justify-center space-x-2 active:scale-95"
                    :class="currentItem.addShot 
                      ? 'bg-amber-500 text-white border-amber-600 font-extrabold shadow-md ring-2 ring-amber-200' 
                      : 'bg-white border-sky-200 text-gray-700 hover:border-amber-300'"
                  >
                    <span>➕ 濃縮 (+10元)</span>
                  </button>

                  <button 
                    type="button"
                    @click="currentItem.addMilk = !currentItem.addMilk"
                    class="py-3 border-2 rounded-xl text-base font-bold transition-all flex items-center justify-center space-x-2 active:scale-95"
                    :class="currentItem.addMilk 
                      ? 'bg-amber-500 text-white border-amber-600 font-extrabold shadow-md ring-2 ring-amber-200' 
                      : 'bg-white border-sky-200 text-gray-700 hover:border-amber-300'"
                  >
                    <span>➕ 多一份牛奶 (+10元)</span>
                  </button>
                </div>
              </div>

              <!-- 備註 -->
              <div>
                <label class="block text-base font-bold text-gray-600 mb-2">備註說明</label>
                <input 
                  type="text" 
                  v-model="currentItem.note" 
                  placeholder="例如：熱飲、特殊需求..."
                  class="w-full border-2 border-sky-200 rounded-xl px-4 py-3 bg-white focus:outline-blue-600 text-lg font-medium"
                >
              </div>

              <button 
                type="button" 
                @click="addToCart"
                class="w-full bg-amber-400 hover:bg-amber-500 text-amber-950 font-extrabold py-4 rounded-xl transition-all text-lg shadow-md active:scale-95 border-2 border-amber-300"
              >
                ＋ 加入點餐清單 (單杯 ${{ currentCalculatedPrice }})
              </button>
            </div>

            <!-- 儲存當天點餐按鈕 -->
            <button 
              type="button"
              @click="saveMyOrders" 
              class="w-full bg-blue-700 hover:bg-blue-800 text-white font-extrabold text-xl py-4 rounded-2xl transition-all shadow-lg active:scale-95"
            >
              儲存我的當日點餐 (${{ getUserTotal(cart) }})
            </button>
          </div>
        </div>
      </main>

      <!-- 底部總計與 Line 一鍵複製按鈕 -->
      <footer class="bg-blue-900 text-white rounded-3xl p-8 space-y-6 shadow-2xl border-2 border-blue-800">
        <div class="flex justify-between items-center">
          <div>
            <div class="text-base text-sky-200 font-bold">當日點餐總金額</div>
            <div class="text-4xl font-black text-amber-300">${{ totalAmount }}</div>
          </div>
          <div class="text-xl text-sky-200 font-bold">
            總杯數：{{ totalCups }} 杯 ({{ orderedUserCount }}/{{ members.length }}人)
          </div>
        </div>

        <button 
          @click="copyLineSummary" 
          class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xl py-4 rounded-2xl transition-all shadow-lg active:scale-95 flex items-center justify-center space-x-3"
        >
          <span>📋 複製 Line 點餐摘要清單</span>
        </button>
      </footer>
    </template>

  </div>

  <script>
    // 註冊 PWA Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('PWA Service Worker 註冊成功：', reg.scope))
          .catch((err) => console.error('PWA Service Worker 註冊失敗：', err));
      });
    }

    // 您的 Firebase 專案金鑰設定
    const firebaseConfig = {
      apiKey: "AIzaSyAAsvAqFhkjbTJ238o7szaeiZI-ntPcTRs",
      authDomain: "morning-coffee-cd165.firebaseapp.com",
      databaseURL: "https://morning-coffee-cd165-default-rtdb.firebaseio.com",
      projectId: "morning-coffee-cd165",
      storageBucket: "morning-coffee-cd165.firebasestorage.app",
      messagingSenderId: "324502960704",
      appId: "1:324502960704:web:a8b6ef48c2b89eeeff3da5"
    };

    // 初始化 Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    const { createApp, ref, computed, onMounted } = Vue;

    createApp({
      setup() {
        const defaultMembers = [
          { id: 'user_1', name: '西堤', pin: '0737' },
        ];

        const members = ref([...defaultMembers]);
        const userPins = ref({});

        const selectedUserToAuth = ref('');
        const inputPin = ref('');
        const authError = ref('');
        const currentUserId = ref(null);

        const selectedDate = ref(new Date().toISOString().split('T')[0]);
        const sweetnessOptions = ['瑞穗', '無乳糖(有點甜)'];
        const iceOptions = ['熱', '正常冰', '少冰', '半冰', '微冰', '去冰'];

        // 每日點餐資料：即時與 Firebase 資料庫同步
        const dailyOrders = ref({});

        // 本人購物車與當前編輯的單品
        const cart = ref([]);
        const currentItem = ref({
          item: '拿鐵',
          qty: 1,
          sweetness: '瑞穗',
          ice: '微冰',
          addShot: false,
          addMilk: false,
          note: ''
        });

        // 選擇品項切換處理（美式清空奶類，其餘品項自動預設奶類）
        const selectItem = (itemName) => {
          currentItem.value.item = itemName;
          if (itemName === '美式') {
            currentItem.value.sweetness = '';
          } else if (!currentItem.value.sweetness) {
            currentItem.value.sweetness = '瑞穗';
          }
        };

        // 監聽雲端 PIN 碼變更
        const listenToPins = () => {
          db.ref('user_pins').on('value', (snapshot) => {
            const data = snapshot.val() || {};
            userPins.value = data;
            members.value.forEach(m => {
              if (data[m.id]) {
                m.pin = data[m.id];
              }
            });
          });
        };

        const loginWithPin = () => {
          authError.value = '';
          if (!selectedUserToAuth.value) {
            authError.value = '請選擇你的名字';
            return;
          }
          const user = members.value.find(m => m.id === selectedUserToAuth.value);
          const validPin = userPins.value[user.id] || user.pin;

          if (user && validPin === inputPin.value) {
            currentUserId.value = user.id;
            localStorage.setItem('coffee_app_current_user', user.id);
            inputPin.value = '';
            listenToOrders();
          } else {
            authError.value = 'PIN 碼錯誤！';
          }
        };

        const logout = () => {
          currentUserId.value = null;
          localStorage.removeItem('coffee_app_current_user');
          selectedUserToAuth.value = '';
          inputPin.value = '';
        };

        let currentDbRef = null;
        const listenToOrders = () => {
          if (currentDbRef) {
            currentDbRef.off();
          }
          currentDbRef = db.ref(`orders/${selectedDate.value}`);
          currentDbRef.on('value', (snapshot) => {
            const val = snapshot.val();
            dailyOrders.value = val || {};

            if (currentUserId.value && dailyOrders.value[currentUserId.value]) {
              cart.value = JSON.parse(JSON.stringify(dailyOrders.value[currentUserId.value]));
            } else {
              cart.value = [];
            }
          });
        };

        const addToCart = () => {
          cart.value.push({ ...currentItem.value });
          currentItem.value = {
            item: '拿鐵',
            qty: 1,
            sweetness: '瑞穗',
            ice: '微冰',
            addShot: false,
            addMilk: false,
            note: ''
          };
        };

        const removeFromCart = (index) => {
          cart.value.splice(index, 1);
        };

        const saveMyOrders = () => {
          if (!currentUserId.value) return;
          const userOrderRef = db.ref(`orders/${selectedDate.value}/${currentUserId.value}`);
          userOrderRef.set(JSON.parse(JSON.stringify(cart.value))).then(() => {
            alert('當日點餐已同步至雲端！其他人立刻看得到！');
          }).catch((err) => {
            console.error('儲存失敗:', err);
            alert('連線儲存失敗，請檢查網路連線。');
          });
        };

        const currentUser = computed(() => {
          return members.value.find(m => m.id === currentUserId.value) || {};
        });

        // 取得品項單價
        const getPrice = (item) => {
          if (item === '拿鐵') return 60;
          if (item === '美式') return 50;
          if (item === '巧克力牛奶') return 60;
          if (item === '摩卡咖啡') return 70;
          return 0;
        };

        const getItemUnitPrice = (itemObj) => {
          let base = getPrice(itemObj.item);
          if (itemObj.addShot) base += 10;
          if (itemObj.addMilk) base += 10;
          return base;
        };

        const currentCalculatedPrice = computed(() => {
          return getItemUnitPrice(currentItem.value);
        });

        const getUserTotal = (userOrders) => {
          if (!userOrders || !Array.isArray(userOrders)) return 0;
          return userOrders.reduce((sum, item) => sum + (getItemUnitPrice(item) * item.qty), 0);
        };

        const myTotalCups = computed(() => {
          return cart.value.reduce((sum, item) => sum + item.qty, 0);
        });

        const totalCups = computed(() => {
          return members.value.reduce((sum, m) => {
            const userOrders = dailyOrders.value[m.id];
            if (userOrders && Array.isArray(userOrders)) {
              return sum + userOrders.reduce((s, item) => s + item.qty, 0);
            }
            return sum;
          }, 0);
        });

        const totalAmount = computed(() => {
          return members.value.reduce((sum, m) => {
            return sum + getUserTotal(dailyOrders.value[m.id]);
          }, 0);
        });

        const orderedUserCount = computed(() => {
          return members.value.filter(m => dailyOrders.value[m.id] && dailyOrders.value[m.id].length > 0).length;
        });

        const copyLineSummary = () => {
          let text = `☕【咖啡點餐統計】${selectedDate.value}\n`;
          text += `------------------------------\n`;

          let hasOrder = false;
          members.value.forEach(m => {
            const orders = dailyOrders.value[m.id];
            if (orders && orders.length > 0) {
              hasOrder = true;
              text += `👤 ${m.name}：\n`;
              orders.forEach(item => {
                const addOns = [item.addShot ? '加濃縮' : '', item.addMilk ? '加牛奶' : ''].filter(Boolean).join('+');
                const specText = item.item === '美式' ? item.ice : `${item.sweetness}/${item.ice}`;
                text += `  • ${item.item} x${item.qty} (${specText})`;
                if (addOns) text += ` [${addOns}]`;
                if (item.note) text += ` 備註:${item.note}`;
                text += ` $${getItemUnitPrice(item) * item.qty}\n`;
              });
            }
          });

          if (!hasOrder) {
            alert('當天尚無任何成員完成點餐！');
            return;
          }

          text += `------------------------------\n`;
          text += `📊 總計：${totalCups.value} 杯 / $${totalAmount.value} 元`;

          navigator.clipboard.writeText(text).then(() => {
            alert('已成功複製 Line 點餐摘要！');
          }).catch(err => {
            console.error('複製失敗:', err);
            alert('複製失敗，請手動複製。');
          });
        };

        onMounted(() => {
          listenToPins();
          const savedUser = localStorage.getItem('coffee_app_current_user');
          if (savedUser) {
            currentUserId.value = savedUser;
            listenToOrders();
          }
        });

        return {
          members,
          selectedUserToAuth,
          inputPin,
          authError,
          currentUserId,
          currentUser,
          loginWithPin,
          logout,
          selectedDate,
          sweetnessOptions,
          iceOptions,
          dailyOrders,
          cart,
          currentItem,
          selectItem,
          addToCart,
          removeFromCart,
          saveMyOrders,
          listenToOrders,
          getPrice,
          getItemUnitPrice,
          currentCalculatedPrice,
          getUserTotal,
          myTotalCups,
          totalCups,
          totalAmount,
          orderedUserCount,
          copyLineSummary
        };
      }
    }).mount('#app');
  </script>
